[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "model_api"
version = "0.1.0"
description = "AI 5200 Project 2 HNN and Baseline MLP"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "numpy",
    "scipy"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
model_api = ["weights/*.pt", "weights/*.safetensors"]

[project.optional-dependencies]
notebooks = [
    "matplotlib",
    "jupyter",
]